<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; worker-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#061018" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Neon Catch — a fast browser arcade game. Catch falling orbs, dodge the voids."
    />
    <title>Neon Catch</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="top-bar">
        <h1 class="brand">Neon Catch</h1>
        <div class="stats" aria-live="polite">
          <div class="stat">
            <span class="stat-label">Score</span>
            <span id="score" class="stat-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Best</span>
            <span id="best" class="stat-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Lives</span>
            <span id="lives" class="stat-value lives">●●●</span>
          </div>
        </div>
      </header>

      <main class="stage-wrap">
        <canvas id="game" width="480" height="640" aria-label="Neon Catch game canvas"></canvas>

        <section id="overlay" class="overlay" data-screen="start">
          <div class="overlay-panel">
            <p class="eyebrow">Arcade Mini-Game</p>
            <h2 id="overlay-title" class="overlay-title">Neon Catch</h2>
            <p id="overlay-copy" class="overlay-copy">
              Slide under glowing orbs. Avoid the dark voids. How long can you last?
            </p>
            <div class="actions">
              <button id="primary-btn" type="button" class="btn btn-primary">Play</button>
            </div>
            <p class="controls-hint">
              <span class="hint-desktop">Move with <kbd>←</kbd> <kbd>→</kbd> or drag / touch the paddle</span>
              <span class="hint-touch">Drag / touch to move the paddle</span>
            </p>
          </div>
        </section>
      </main>

      <footer class="footer">
        <p>HTML · CSS · JS · no build step</p>
      </footer>
    </div>

    <script src="js/game.js" defer></script>
  </body>
</html>
